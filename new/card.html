<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡 ID 卡設計展示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef4fb;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #102a43;
            padding: 24px;
        }

        .card {
            width: min(780px, 100%);
            max-width: 780px;
            background: #d8e8f7;
            border: 1px solid #bcd7ed;
            border-radius: 26px;
            box-shadow: 0 24px 60px rgba(16, 42, 67, 0.12);
            padding: 32px 30px;
            position: relative;
            overflow: hidden;
        }

        .card::before,
        .card::after {
            content: "";
            position: absolute;
            border: 2px dashed #6b8ab7;
            width: 72px;
            height: 72px;
        }

        .card::before {
            top: 18px;
            right: 18px;
            border-left: none;
            border-bottom: none;
        }

        .card::after {
            bottom: 18px;
            left: 18px;
            border-right: none;
            border-top: none;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        .label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #1f3c58;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid #c8d8e6;
            backdrop-filter: blur(6px);
        }

        .circles {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #5b7fa5;
            opacity: 0.85;
        }

        .circle:nth-child(2) {
            background: #f8fafc;
            border: 1px solid #8fa9c4;
        }

        .circle:nth-child(3) {
            background: #ffffff;
            opacity: 1;
            border: 1px solid #94a3b8;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
            align-items: stretch;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            color: #2e4a6e;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .field-value {
            font-size: clamp(28px, 3.2vw, 38px);
            font-weight: 700;
            color: #102a43;
            padding-bottom: 8px;
            border-bottom: 2px dashed #6b8ab7;
            max-width: fit-content;
            line-height: 1.05;
        }

        .small-value {
            font-size: 20px;
            font-weight: 500;
            color: #1f3c58;
        }

        .portrait-card {
            position: relative;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #c8d8e6;
            border-radius: 24px;
            min-height: 260px;
            padding: 20px;
        }

        .portrait-frame {
            width: 100%;
            max-width: 170px;
            aspect-ratio: 3 / 4;
            border-radius: 22px;
            background: #f8fafc;
            border: 1px dashed #8fa9c4;
            display: grid;
            place-items: center;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(79, 115, 150, 0.08);
        }

        .portrait-shape {
            width: 76%;
            height: 76%;
            border-radius: 24px;
            background: linear-gradient(180deg, #ffffff 0%, #d9e7f4 100%);
            display: grid;
            place-items: center;
            position: relative;
        }

        .portrait-head {
            width: 48px;
            height: 56px;
            border-radius: 50% 50% 46% 46%;
            background: #8fa9c4;
            position: absolute;
            top: 18%;
        }

        .portrait-body {
            width: 62px;
            height: 88px;
            background: #8fa9c4;
            border-radius: 30px 30px 12px 12px;
            position: absolute;
            bottom: 16%;
        }

        .barcode {
            margin-top: 24px;
            height: 44px;
            width: 100%;
            max-width: 340px;
            background: repeating-linear-gradient(
                90deg,
                #1f3c58,
                #1f3c58 3px,
                transparent 3px,
                transparent 6px,
                #1f3c58 6px,
                #1f3c58 7px,
                transparent 7px,
                transparent 10px
            );
            border: 1px solid rgba(31, 60, 88, 0.16);
            border-radius: 10px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
        }

        .bottom-text {
            margin-top: 20px;
            font-size: 12px;
            color: #2e4a6e;
            letter-spacing: 0.06em;
            opacity: 0.9;
        }

        @media (max-width: 760px) {
            .card {
                padding: 24px;
            }
            .main-grid {
                grid-template-columns: 1fr;
            }
            .portrait-card {
                min-height: 220px;
            }
            .field-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top-row">
            <div class="label">ID-CARD</div>
            <div class="circles">
                <span class="circle"></span>
                <span class="circle"></span>
                <span class="circle"></span>
            </div>
        </div>

        <div class="main-grid">
            <div class="fields">
                <div class="field">
                    <span class="field-label">name:</span>
                    <span class="field-value">王大明</span>
                </div>
                <div class="field">
                    <span class="field-label">date of birth:</span>
                    <span class="field-value small-value">1700 / 09 / 86</span>
                </div>
                <div class="field">
                    <span class="field-label">skill:</span>
                    <span class="field-value small-value">UI / UX / Front-End</span>
                </div>
            </div>

            <div class="portrait-card">
                <div class="portrait-frame">
                    <img src="img/portrait.png" alt="Portrait" style="width: 100%; height: 100%; object-fit: cover; border-radius: 22px;" />
                </div>
            </div>
        </div>

        <div class="barcode"></div>
        <div class="bottom-text">| 極簡風 ID 卡 | 現代質感設計 |</div>
    </div>
</body>
</html>
